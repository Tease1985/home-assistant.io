AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false

# Disable pure style cops that don't affect correctness
Style/StringLiterals:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Layout/LineLength:
  Max: 200

# Jekyll plugin initialize methods intentionally don't call super
# (the parent Jekyll::Page signature differs)
Lint/MissingSuper:
  Enabled: false

# Block chains over multiple .end.sort_by{}.map{} calls are idiomatic Ruby
Style/MultilineBlockChain:
  Enabled: false

# Some plugin methods require 6 keyword args by design (vars/component/platform/converter/classes/parent_type)
Metrics/ParameterLists:
  Max: 6

# Enforce meaningful cops
Security/Eval:
  Enabled: true

Lint/ShadowingOuterLocalVariable:
  Enabled: true

Lint/UnusedMethodArgument:
  Enabled: true

Lint/UnusedBlockArgument:
  Enabled: true

Lint/SuppressedException:
  Enabled: true

Style/RescueStandardError:
  Enabled: true
